<style>
#brandon-demo{--paper:light-dark(#f6f7f5,#171d1c);--surface:light-dark(#ffffff,#222b28);--ink:light-dark(#18332b,#e5eee8);--muted:light-dark(#66766e,#abbcb1);--line:light-dark(#dce4dd,#3d4c44);--accent:light-dark(#25624b,#90d3ad);--wash:light-dark(#e7f1e9,#2d4638);font:14px/1.5 system-ui;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#brandon-demo *{box-sizing:border-box}#brandon-demo button,#brandon-demo input,#brandon-demo textarea,#brandon-demo select{font:inherit;color:inherit}#brandon-demo button{cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 12px}#brandon-demo button.primary{background:var(--accent);color:light-dark(#fff,#14291c);border-color:var(--accent)}#brandon-demo .top{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:var(--surface);border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}#brandon-demo .brand{font-size:18px;font-weight:650;letter-spacing:-.5px}#brandon-demo .pill{font-size:12px;background:var(--wash);padding:4px 9px;border-radius:20px}#brandon-demo .shell{display:grid;grid-template-columns:180px 1fr}#brandon-demo nav{padding:20px 12px;border-right:1px solid var(--line);background:var(--surface)}#brandon-demo nav button{display:block;text-align:left;width:100%;border:0;margin:3px 0;background:transparent}#brandon-demo nav button.active{background:var(--wash);color:var(--accent);font-weight:600}#brandon-demo main{padding:28px;min-width:0;min-height:560px}#brandon-demo h2{font-size:25px;font-weight:600;letter-spacing:-.7px;margin:0 0 4px}#brandon-demo h3{font-size:15px;margin:0 0 8px}#brandon-demo p{margin:0 0 16px}#brandon-demo .muted{color:var(--muted)}#brandon-demo .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#brandon-demo .spread{justify-content:space-between}#brandon-demo .box{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:18px;margin-top:16px}#brandon-demo .listitem{padding:14px 0;border-bottom:1px solid var(--line)}#brandon-demo .listitem:last-child{border:0}#brandon-demo small{font-size:12px;color:var(--muted)}#brandon-demo input,#brandon-demo select,#brandon-demo textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px;max-width:100%}#brandon-demo textarea{width:100%;min-height:170px;resize:vertical}#brandon-demo .grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}#brandon-demo .metric{font-size:26px;margin:6px 0}#brandon-demo details{margin:7px 0}#brandon-demo summary{cursor:pointer}#brandon-demo ul{padding-left:20px}#brandon-demo .bar{height:8px;background:var(--wash);margin:7px 0 16px;border-radius:6px}#brandon-demo .bar span{display:block;height:100%;background:var(--accent);border-radius:6px}#brandon-demo #notice{padding:0 28px 12px;color:var(--accent);min-height:30px}#brandon-demo .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);margin-bottom:16px}#brandon-demo .mini{padding:5px 9px;font-size:12px}#brandon-demo [hidden]{display:none!important}@media(max-width:650px){#brandon-demo .shell{grid-template-columns:1fr}#brandon-demo nav{display:flex;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:8px}#brandon-demo nav button{width:auto}#brandon-demo main{padding:18px}#brandon-demo .grid{grid-template-columns:1fr}}
</style>
<div id="brandon-demo">
<header class="top"><div class="brand">aspire <span class="muted">/ content studio</span></div><div class="row"><span class="pill">Demo · sample data</span><span>Roger R.</span></div></header>
<div class="shell"><nav aria-label="Workspace sections"><div class="eyebrow">Brandon's workspace</div><button data-page="shoot" class="active">Plan a shoot</button><button data-page="transcript">Transcript → captions</button><button data-page="queue">Ready to post</button><button data-page="insights">Performance</button><button data-page="library">Content library</button><div class="box"><small>Studio first<br>10 videos per session<br>Questions, not scripts</small></div></nav><main id="content"></main></div><div id="notice" aria-live="polite"></div>
</div>
<script>
(()=>{const root=document.getElementById('brandon-demo'),main=root.querySelector('main'),notice=root.querySelector('#notice');let page='shoot',approved=false,generated=false,saved=false,platform='Instagram';let transcript='The best way to get a good deal when buying commercial properties is to figure out what you can do better than your competition. Find opportunities where your strengths can significantly increase the value.';
const ideas=[['Overrated or underrated: choosing an office','Ranking','Relevant reach',['Company name on the building','Private offices','Close to employees','Room to double the team'],'Familiar decisions with room for a strong opinion.'],['Green flag or red flag: choosing your first space','Green / red flag','Relevant reach',['Near your biggest competitor','Extra space for future growth','Bringing a contractor to the tour'],'New situations in a familiar format.'],['What would you choose early in your career?','This or that','Discovery',['Higher salary or a better mentor?','Big company or more responsibility?','Hometown or the right opportunity?'],'A broader topic connected to Brandon’s experience.'],['How much does location matter?','Ranking','Relevant reach',['Coffee shop','Dentist','Auto repair','Accounting firm'],'Real estate explained through recognizable businesses.'],['When does buying your own office make sense?','Question','Expertise',[],'Clarifies the context behind buying versus leasing.'],['What do owners underestimate about a second location?','Question','Expertise',[],'A concrete business decision.'],['What makes you advise a client to do nothing?','Question','Expertise',[],'Shows judgment beyond closing a transaction.'],['Why did you name the company Aspire?','Question','Brand',[],'Roger’s question; helps people know Brandon.'],['What was the first role you hired for, and why?','Question','Brand',[],'A specific founder story with minimal preparation.'],['How is AI impacting your real estate business?','Question','Discovery',[],'Ground the answer in actual work at Aspire.']];
const library=[['Finding your advantage in a deal','Filmed','Commercial investing'],['Why did you name Aspire?','Idea','Personal brand'],['Your property manager should save you time','Posted','Property management'],['Ranking office features','Idea','Ranking']];let queue=[['Finding your advantage in a deal','Needs approval'],['Which jobs make you a millionaire?','Approved'],['What makes a great tenant?','Approved']];
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function msg(t){notice.textContent=t}function heading(t,s){return '<h2>'+t+'</h2><p class="muted">'+s+'</p>'}function render(){root.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
if(page==='shoot'){main.innerHTML=heading('Your next filming session','A practical mix of discovery, expertise, and Brandon’s story.')+'<div class="row spread"><div class="row"><span class="pill">10 videos</span><span class="pill">Office studio</span><span class="pill">No scripts</span></div><button class="primary" id="approve">'+(approved?'Session approved':'Approve session')+'</button></div><div class="box"><div class="row spread"><h3>Suggested lineup</h3><small>Editable demo suggestions</small></div>'+ideas.map((v,i)=>'<div class="listitem"><div class="row spread"><div><small>'+String(i+1).padStart(2,'0')+' · '+v[1]+' · '+v[2]+'</small><div>'+esc(v[0])+'</div></div><button class="mini" data-swap="'+i+'">Swap</button></div><details><summary><small>Prompts & reason</small></summary>'+(v[3].length?'<ul>'+v[3].map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+'<small>'+v[4]+'</small></details></div>').join('')+'</div>';main.querySelector('#approve').onclick=()=>{approved=!approved;render();msg(approved?'Session approved in this preview.':'Session reopened.')};main.querySelectorAll('[data-swap]').forEach(b=>b.onclick=()=>{let i=+b.dataset.swap;ideas[i]=['What did accounting teach you about running Aspire?','Question','Brand',[],'An alternate prompt from the sample idea bank.'];approved=false;render();msg('Replaced one idea. The rest of your session stays in place.')})}
if(page==='transcript'){main.innerHTML=heading('Turn footage into copy','Paste a transcript, review the options, and save what you actually use.')+'<label for="transcript-input">Transcript</label><textarea id="transcript-input">'+esc(transcript)+'</textarea><div class="row spread"><small>Preview uses prewritten sample output, not live AI.</small><button class="primary" id="generate">Preview caption package</button></div>'+(generated?'<div class="box"><div class="row"><button data-platform="Instagram">Instagram</button><button data-platform="YouTube">YouTube</button><button data-platform="X">X</button></div><p style="margin-top:15px"><small>'+platform+' · Editable sample</small></p><textarea id="copy-output">'+esc(platform==='Instagram'?'Before you compete to buy a property, ask yourself what you can do with it that the other buyers can’t.':platform==='YouTube'?'How to Find Commercial Real Estate Deals That Fit Your Strengths\n\nFinding a good deal starts with understanding what you can do well. Brandon explains how your experience shapes which properties make sense for you.\n\nSubscribe for more commercial real estate breakdowns in plain English.':'What can you do with that property that the other buyers can’t? Have an answer before you stretch on price.')+'</textarea><div class="row"><button class="primary" id="save">Save approved copy</button><button id="copy">Copy text</button></div></div>':'');main.querySelector('#transcript-input').oninput=e=>transcript=e.target.value;main.querySelector('#generate').onclick=()=>{if(!transcript.trim()){msg('Paste a transcript first.');return}generated=true;render();msg('Showing sample copy for the example deal transcript.')};if(generated){main.querySelectorAll('[data-platform]').forEach(b=>b.onclick=()=>{platform=b.dataset.platform;render()});main.querySelector('#save').onclick=()=>{saved=true;queue[0][1]='Approved';msg('Approved in the demo. Find it in Ready to post.')};main.querySelector('#copy').onclick=async()=>{const text=main.querySelector('#copy-output').value;try{await navigator.clipboard.writeText(text);msg('Copied.')}catch(e){main.querySelector('#copy-output').select();msg('Text selected. Use your copy shortcut.')}}}}
if(page==='queue'){main.innerHTML=heading('Ready to post','Keep approved copy and publishing status together.')+'<div class="box">'+queue.map((v,i)=>'<div class="listitem"><div class="row spread"><div><small>Instagram Reel · sample asset</small><h3>'+v[0]+'</h3><span class="pill">'+v[1]+'</span></div><button data-review="'+i+'">'+(v[1]==='Approved'?'Mark posted':'Review copy')+'</button></div></div>').join('')+'</div><p style="margin-top:16px" class="muted">No accounts connected. Actions here do not publish anything.</p>';main.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{let i=+b.dataset.review;if(queue[i][1]==='Approved'){queue[i][1]='Posted';render();msg('Marked posted in the demo only.')}else{page='transcript';generated=true;render()}})}
if(page==='insights'){main.innerHTML=heading('What should we make next?','Illustrative 7-day results · all numbers below are fictional.')+'<div class="grid"><div class="box"><small>Real estate comparisons · 6 posts</small><div class="metric">18,400</div><small>Median views at 7 days</small></div><div class="box"><small>Recent follower sample · 40 profiles</small><div class="metric">23 of 40</div><small>Identified as real estate professionals</small></div></div><div class="box"><h3>Median 7-day views by format</h3>'+[['CRE comparisons',18400],['Brandon stories',6200],['Owner education',3900]].map(v=>'<div class="row spread"><span>'+v[0]+'</span><span>'+v[1].toLocaleString()+'</span></div><div class="bar"><span style="width:'+v[1]/184+'%"></span></div>').join('')+'</div><div class="box"><h3>Example editorial takeaways</h3><p>Try another tenant comparison. Keep one founder story in the next session. Give repeated property-management advice a more specific example.</p><button id="plan">Review next session</button></div>';main.querySelector('#plan').onclick=()=>{page='shoot';render()}}
if(page==='library'){main.innerHTML=heading('Find something Brandon said','Search sample topics, opinions, and ideas.')+'<label for="find">Search library</label><input id="find" type="search" placeholder="Try property, Aspire, or ranking" style="width:100%"><div class="box" id="results"></div>';const show=term=>{let found=library.filter(x=>x.join(' ').toLowerCase().includes(term.toLowerCase()));main.querySelector('#results').innerHTML=found.length?found.map(v=>'<div class="listitem"><small>'+v[1]+' · '+v[2]+'</small><h3>'+v[0]+'</h3></div>').join(''):'No sample items match.'};show('');main.querySelector('#find').oninput=e=>show(e.target.value)}
}root.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;msg('');render()});render();const design={compact:false};if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{main.style.padding=design.compact?'18px':'28px'}});t.addToggle(design,'compact',{label:'Compact layout'})}
})();
</script>
